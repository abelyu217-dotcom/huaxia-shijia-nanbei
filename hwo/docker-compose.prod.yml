# HWO 生产环境 docker-compose（腾讯云 CVM 部署）
# 用法：
#   1. 复制 .env.production.example 为 .env 并填好密码
#   2. ./deploy.sh build          # 构建镜像
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. docker compose -f docker-compose.prod.yml exec api sh -c "cd packages/api && npx prisma migrate deploy"
#   5. （首次）docker compose -f docker-compose.prod.yml exec api sh -c "cd packages/api && npx prisma db seed"

name: hwo-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: hwo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hwo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-hwo}
    # 不暴露端口到公网，仅内部网络访问
    expose: ["5432"]
    volumes:
      - hwo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hwo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hwo-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--appendonly", "yes"]
    expose: ["6379"]
    volumes:
      - hwo-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hwo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hwo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    expose: ["9000", "9001"]
    volumes:
      - hwo-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: hwo-api:latest
    container_name: hwo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hwo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hwo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hwo}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-hwo-replays}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      SIM_CONFIG_POSSESSIONS_PER_QUARTER: ${SIM_CONFIG_POSSESSIONS_PER_QUARTER:-25}
      SIM_CONFIG_HOME_ADVANTAGE: ${SIM_CONFIG_HOME_ADVANTAGE:-3}
    expose: ["3000"]

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    image: hwo-worker:latest
    container_name: hwo-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hwo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hwo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hwo}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-hwo-replays}

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: hwo-web:latest
    container_name: hwo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  hwo-pgdata:
  hwo-redisdata:
  hwo-miniodata:
