# HWO 开发环境 docker-compose
# 一条命令起全套基础设施：docker compose up -d
# 参见：技术架构文档 §9.1

services:
  postgres:
    image: postgres:16-alpine
    container_name: hwo-postgres
    environment:
      POSTGRES_USER: hwo
      POSTGRES_PASSWORD: hwo_dev
      POSTGRES_DB: hwo
    ports:
      - "5432:5432"
    volumes:
      - hwo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwo"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hwo-redis
    ports:
      - "6379:6379"
    volumes:
      - hwo-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: hwo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hwo
      MINIO_ROOT_PASSWORD: hwo_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hwo-miniodata:/data

volumes:
  hwo-pgdata:
  hwo-redisdata:
  hwo-miniodata:
