<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWO - 离线模式</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 40px; }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 12px; color: #ffd700; }
    p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; }
    button {
      margin-top: 24px;
      padding: 12px 32px;
      background: #ffd700;
      color: #0f0f1e;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🏀</div>
    <h1>当前处于离线模式</h1>
    <p>您目前没有网络连接。<br>部分数据（如球队阵容、积分榜）可从缓存查看。<br>请恢复网络后继续游戏。</p>
    <button onclick="location.href='/'">重试连接</button>
  </div>
</body>
</html>
